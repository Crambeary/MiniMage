name: Deploy to itch.io

# Releases are deliberate: push a version tag.
#   v0.4.1-rc1  -> staging itch project (restricted), for testing in the real itch iframe
#   v0.4.1      -> production itch project
# Nothing runs on ordinary pushes, to stay inside the free-tier Actions minutes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)deploy, e.g. v0.4.1-rc1 or v0.4.0 for a rollback
        required: true

# itch.io rejects a butler push while the channel's previous build is still
# processing, so overlapping deploys must queue rather than race.
concurrency:
  group: deploy-itch
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable
  ITCH_USER: crambeary
  PRODUCTION_GAME: mini-mage
  STAGING_GAME: mini-mage-staging

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and target
        id: target
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            *-rc*) game="$STAGING_GAME" ;;
            *)     game="$PRODUCTION_GAME" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "game=$game" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag to $ITCH_USER/$game"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Export Web build
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          cache: true
          use_preset_export_path: true
          presets_to_export: Web

      - name: Publish to itch.io
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: ${{ steps.target.outputs.game }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: build/web
          VERSION: ${{ steps.target.outputs.tag }}
