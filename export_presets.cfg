html/head_include="<!-- Google tag (gtag.js) -->
<script async src=\"https://www.googletagmanager.com/gtag/js?id=G-9950RN0Z1T\"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-9950RN0Z1T');

  window.miniMageSession = window.miniMageSession || {
    open: false,
    id: '',
    startedMs: 0,
    platform: '',
    finalSent: false
  };

  window.miniMagePublishSession = function (state, resetFinal) {
    var prev = window.miniMageSession || {};
    var next = Object.assign({}, prev, state || {});
    if (resetFinal) {
      next.finalSent = false;
    } else if (prev.finalSent) {
      next.open = false;
      next.finalSent = true;
    } else {
      next.finalSent = !!prev.finalSent;
    }
    window.miniMageSession = next;
  };

  window.miniMageAnalytics = function (eventName, paramsJson) {
    var params = {};
    if (typeof paramsJson === 'string') {
      try {
        params = JSON.parse(paramsJson) || {};
      } catch (err) {
        params = {};
      }
    } else if (paramsJson && typeof paramsJson === 'object') {
      params = paramsJson;
    }
    if (eventName === 'session_duration' && params.partial === true) {
      return;
    }
    var session = window.miniMageSession || {};
    if (eventName === 'session_duration' && params.partial === false) {
      if (session.finalSent) {
        return;
      }
      session.finalSent = true;
      session.open = false;
      window.miniMageSession = session;
    }
    if (typeof gtag === 'function') {
      gtag('event', eventName, params);
    }
  };

  function miniMageFlushQuit() {
    var session = window.miniMageSession;
    if (!session || !session.open || session.finalSent) {
      return;
    }
    var started = Number(session.startedMs || 0);
    var duration = Date.now() - started;
    if (!isFinite(duration) || duration < 0) {
      duration = 0;
    }
    window.miniMageAnalytics('session_duration', JSON.stringify({
      game_session_id: session.id || '',
      game_platform: session.platform || '',
      duration_ms: Math.round(duration),
      session_end_reason: 'quit',
      partial: false,
      transport_type: 'beacon'
    }));
  }

  window.addEventListener('pagehide', miniMageFlushQuit);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      miniMageFlushQuit();
    }
  });
</script>
